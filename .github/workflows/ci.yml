# Checks are defined in the Makefile. 5.5 is the one OCaml litany reads.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      # The Makefile's pins, on setup-ocaml's switch.
      - run: make pin SWITCH=
      - run: opam install . --deps-only --with-test --with-doc -y
      - run: opam install -y ocamlformat.0.29.0
      - run: make lint OPAM="opam exec --"
      - run: make test OPAM="opam exec --"

  # The oldest versions the opam file allows, as opam-repository checks.
  lower-bounds:
    runs-on: ubuntu-24.04
    env:
      OPAMCRITERIA: +removed,+count[version-lag,solution]
      OPAMFIXUPCRITERIA: +removed,+count[version-lag,solution]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          opam-repositories: |
            hypha: https://github.com/hyphatech/opam-repository.git
            default: https://opam.ocaml.org
      - run: make pin SWITCH=
      - run: opam install . --deps-only --with-test -y
      - run: opam list --installed --columns=name,version
      - run: make build OPAM="opam exec --"
      - run: make test OPAM="opam exec --"
